<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>La Perlé Club · Wallet-Designs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191616;color:#f6f0e7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:42px 24px}header,main,footer{max-width:1220px;margin:auto}header p{color:#c3b2a4;font-size:12px;letter-spacing:.17em}h1{font:400 clamp(30px,4vw,45px) Georgia,serif;margin:12px 0 25px}.switch{display:flex;gap:8px;margin-bottom:32px}.switch button{font:inherit;color:#dfd0c1;background:transparent;border:1px solid #6d5c50;border-radius:999px;padding:12px 22px;cursor:pointer}.switch button[aria-pressed=true]{color:#201b18;background:#e3cfb4;border-color:#e3cfb4}button:focus-visible{outline:3px solid white;outline-offset:4px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.rank-name{font-size:13px;text-transform:uppercase;letter-spacing:.15em;margin:0 0 12px;color:#dfd0c1}.card{border-radius:17px;overflow:hidden;color:var(--ink);background:var(--base);box-shadow:0 12px 30px #0003}.apple-top{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{width:145px;height:auto;display:block}.points{text-align:right;font-size:26px;line-height:1.1}.label{font-size:10px;letter-spacing:.045em;display:block;margin-bottom:5px;font-weight:500}.strip{position:relative;aspect-ratio:375/123;display:flex;align-items:flex-end;padding:15px 16px;background-image:var(--strip);background-size:100% 100%}.name{font-size:28px;font-weight:500;letter-spacing:-.025em;line-height:1.15}.fields{padding:18px 16px;display:flex;justify-content:space-between;gap:14px;font-size:14px;line-height:1.3}.fields>div:last-child{text-align:right}.qr-area{display:grid;place-items:center;padding:10px 0 23px}.qr{width:112px;height:112px;display:grid;place-items:center;background:#fff;border-radius:6px;color:#626262;font-size:11px;text-align:center;line-height:1.7;border:12px solid #fff;outline:1px solid #0001;outline-offset:-1px}.qr::before{content:"QR-Code\A Vorschau";white-space:pre-line}.card-id{font-size:10px;margin-top:8px;letter-spacing:.08em}.google{display:none}.google-top{padding:22px 20px 10px}.google-top .logo{width:160px;margin-bottom:16px}.program{font-size:21px;font-weight:500}.google-name{padding:18px 20px 0}.google-date{padding:17px 20px 0;font-size:15px}.google .fields{padding:20px}.google .hero{display:block;width:100%;height:auto}.google .qr-area{padding:20px}.google .name{font-size:27px}body[data-platform=google] .apple{display:none}body[data-platform=google] .google{display:block}footer{font-size:12px;color:#c3b2a4;line-height:1.7;padding-top:30px}footer a{color:inherit}footer p{margin:0 0 8px}@media(max-width:1000px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){body{padding:28px 18px}main{grid-template-columns:1fr;max-width:390px;gap:27px}.switch button{padding:11px 17px}}
</style>
</head>
<body data-platform="apple">
<header><p>LA PERLÉ CLUB</p><h1>Fünf Ränge. Eine Handschrift.</h1><div class="switch" aria-label="Wallet auswählen"><button type="button" data-platform="apple" aria-pressed="true">Apple Wallet</button><button type="button" data-platform="google" aria-pressed="false">Google Wallet</button></div></header>
<main id="cards" aria-label="Rangdesigns"></main>
<footer><p>Designvorschau mit Beispieldaten. Schrift, Abstände und QR-Code stellt die jeweilige Wallet-App auf dem Gerät dar.</p><p>Metallische Rangfarben, originale Wortmarke und dezente Facetten. Mitgliedsdaten bleiben eigenständige, aktualisierbare Felder.</p></footer>
<script>
const base='../assets/wallet/refined-metallic-v4/';
const ranks=[['bronze','Bronze','#78533F','#FFF0DA','Silber'],['silber','Silber','#C4CBD1','#24252A','Gold'],['gold','Gold','#C8AC74','#322519','Platin'],['platin','Platin','#D0D0C9','#30312F','Diamant'],['diamant','Diamant','#D1E2EC','#203342',null]];
document.getElementById('cards').innerHTML=ranks.map(([slug,name,color,ink,next])=>{
 const logo=`<img class="logo" src="${base}apple/${slug}/logo@3x.png" alt="La Perlé Beauty Boutique">`;
 const qr='<div class="qr-area"><div class="qr" aria-label="Platzhalter für den nativen QR-Code"></div><span class="card-id">BEISPIEL · KEINE KUNDENKARTE</span></div>';
 return `<section style="--base:${color};--ink:${ink};--strip:url('${base}apple/${slug}/strip@3x.png')"><h2 class="rank-name">${name}</h2><article class="card apple" aria-label="Apple Wallet ${name}"><div class="apple-top">${logo}<div class="points"><span class="label">PERLEN</span>250</div></div><div class="strip"><div><span class="label">${name.toUpperCase()} · LA PERLÉ CLUB</span><div class="name">Mia Beispiel</div></div></div><div class="fields"><div><span class="label">MITGLIED SEIT</span>20.09.2026</div><div><span class="label">${next?'BIS '+next.toUpperCase():'DEIN STATUS'}</span>${next?'Noch 120 Perlen':'Höchster Rang erreicht'}</div></div>${qr}</article><article class="card google" aria-label="Google Wallet ${name}"><div class="google-top">${logo}<div class="program">La Perlé Club</div></div><div class="google-name"><span class="label">MITGLIED</span><div class="name">Mia Beispiel</div></div><div class="google-date"><span class="label">MITGLIED SEIT</span>20.09.2026</div><div class="fields"><div><span class="label">PERLEN</span>250</div><div><span class="label">${next?name.toUpperCase()+' → '+next.toUpperCase():name.toUpperCase()}</span>${next?'Noch 120 Perlen':'Höchster Rang erreicht'}</div></div>${qr}<img class="hero" src="${base}google/${slug}/hero.png" alt="${name}: metallisches Rangmotiv" width="1032" height="812"></article></section>`;
}).join('');
document.querySelectorAll('button[data-platform]').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.platform=button.dataset.platform;document.querySelectorAll('button[data-platform]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
</script>
</body></html>
