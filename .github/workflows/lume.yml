name: Lumé prüfen
on:
  push:
    paths: ["lume/**", ".github/workflows/lume.yml"]
  pull_request:
    paths: ["lume/**", ".github/workflows/lume.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lume
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: lume/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lume/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @lume/backoffice build
      - run: pnpm typecheck
